
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080d38">
  <title>Star Guardian — Space Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <canvas id="gameCanvas"></canvas>

    <div class="top-hud">
      <div class="lives" id="lives">
        <span>♥</span><span>♥</span><span>♥</span>
      </div>

      <div class="stats">
        <div class="score-label">CURRENT POINTS</div>
        <div class="score" id="score">0</div>
        <div class="objective">
          <span>✦ <b id="gems">0</b>/<span id="gemGoal">10</span></span>
          <span>⌛ <b id="timer">00:00</b></span>
        </div>
      </div>

      <button id="pauseBtn" class="pause-button" aria-label="Pause">Ⅱ</button>
    </div>

    <div id="bossHud" class="boss-hud hidden">
      <div class="boss-name">VOID DRAGON</div>
      <div class="boss-track"><div id="bossHealth"></div></div>
    </div>

    <div class="bottom-hud">
      <div class="joystick" id="joystick">
        <div class="joy-ring"></div>
        <div id="joyKnob" class="joy-knob">✧</div>
      </div>

      <div class="action-buttons">
        <button id="shieldBtn" class="skill-button shield-button" aria-label="Shield">
          <span>◈</span><small>SHIELD</small>
        </button>
        <button id="specialBtn" class="skill-button special-button" aria-label="Special attack">
          <span>✦</span><small id="specialCount">2/2</small>
        </button>
      </div>
    </div>

    <div id="messageScreen" class="overlay">
      <div class="menu-card">
        <div class="eyebrow">✦ A COSMIC ADVENTURE ✦</div>
        <div class="logo">STAR<br><span>GUARDIAN</span></div>
        <p id="menuDescription">Fly through the stars. Defeat the enemies. Conquer the Void Dragon.</p>
        <div class="menu-features">♥ 3 LIVES &nbsp; ✦ POWER-UPS &nbsp; ◈ BOSS FIGHTS</div>
        <button id="startBtn" class="main-button">START GAME</button>
        <p class="control-hint">Move with the joystick · Survive · Collect gems</p>
      </div>
    </div>

    <div id="pauseScreen" class="overlay hidden">
      <div class="menu-card">
        <div class="logo small-logo">GAME<br><span>PAUSED</span></div>
        <p>Catch your breath, Guardian.</p>
        <button id="resumeBtn" class="main-button">RESUME</button>
        <button id="restartBtn" class="secondary-button">RESTART GAME</button>
      </div>
    </div>

    <div id="notice" class="notice"></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
